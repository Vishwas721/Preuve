name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: preuve
          POSTGRES_PASSWORD: preuve
          POSTGRES_DB: preuve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U preuve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://preuve:preuve@127.0.0.1:5432/preuve
      TEST_DATABASE_URL: postgresql+asyncpg://preuve:preuve@127.0.0.1:5432/preuve_test
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      # Supply chain (Phase 5C): fail on any known vulnerability in runtime dependencies.
      - run: uv export --no-dev --no-hashes --format requirements-txt > /tmp/requirements.txt
      - run: uvx pip-audit -r /tmp/requirements.txt --progress-spinner off

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Supply chain (Phase 5C): runtime dependencies only, high or critical fails the build.
      - run: pnpm audit --prod --audit-level high

  # Phase 5D: build the production images, deploy them as the production stack, smoke-test it
  # (health, migrations, pages, backup verified by a restore), then on main push the very
  # images that were tested to GHCR.
  deploy-smoke:
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE: docker compose -p preuve-prod --env-file infra/.env.prod -f infra/docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4
      - name: Production settings with generated secrets
        run: |
          cp infra/.env.prod.example infra/.env.prod
          for k in POSTGRES_PASSWORD OUTREACH_SECRET SEARXNG_SECRET; do
            sed -i "s|^$k=\$|$k=$(openssl rand -hex 32)|" infra/.env.prod
          done
          sed -i 's|^PREUVE_TAG=.*|PREUVE_TAG=ci|' infra/.env.prod
          printf 'PREUVE_API_IMAGE=preuve-api\nPREUVE_WEB_IMAGE=preuve-web\n' >> infra/.env.prod
      - name: Build and deploy
        run: bash infra/scripts/deploy.sh --build --tag ci
      - name: Smoke checks
        run: |
          curl -fsS http://localhost:3100/api/health
          curl -fsS http://localhost:3100/api/auth/status | grep -q '"needs_setup":true'
          curl -fsS -o /dev/null http://localhost:3100/login
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/ideas)" = 401
          $COMPOSE exec -T api alembic current | grep -q '(head)'
          $COMPOSE ps --format '{{.Service}} {{.Status}}'
      - name: Backup, then verify it by a restore
        run: bash infra/scripts/backup.sh && bash infra/scripts/verify-backup.sh
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --tail 80
      - name: Push the tested images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          for img in api web; do
            for tag in '${{ github.sha }}' latest; do
              docker tag "preuve-$img:ci" "ghcr.io/$owner/preuve-$img:$tag"
              docker push "ghcr.io/$owner/preuve-$img:$tag"
            done
          done
